  <body>
    <!-- Splash screen — visible instantly, fades out when React mounts -->
    <div id="splash" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FFF8E1;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    ">
      <div style="
        font-size: 3.5rem; line-height: 1; color: #FF9933;
        animation: splash-breathe 2.4s ease-in-out infinite;
      ">ॐ</div>
    </div>
    <style>
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
    </style>
    <script>
      // Respect saved Deepam (dark) mode for splash
      try {
        var s = JSON.parse(localStorage.getItem('sadhana-reader-settings') || '{}');
        if (s.deepamMode) {
          var el = document.getElementById('splash');
          if (el) {
            el.style.background = '#1A1208';
            el.children[0].style.color = '#FFB300';
            el.children[1].style.color = '#8D6E63';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#1A1208');
        }
      } catch(e) {}
    </script>
    <script>
      // GitHub Pages SPA support: restore path from 404.html redirect query param
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>

    <div id="root"></div>
  </body>
