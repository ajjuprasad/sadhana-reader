name: Deploy Firebase Functions & Rules

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: cd functions && npm ci

      - name: Build functions
        run: cd functions && npm run build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Firebase CLI
        run: npm install -g firebase-tools

      - name: Select Firebase project
        run: firebase use ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      # Razorpay secret setup is disabled until payment functions are
      # re-enabled in functions/src/index.ts.

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --force

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules
