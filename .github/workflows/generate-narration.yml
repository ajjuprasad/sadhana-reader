name: Generate Story Narration

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (leave empty for all stories)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Generate narration audio
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.story_id }}" ]; then
            npx tsx scripts/generate-narration.ts "${{ github.event.inputs.story_id }}"
          else
            npx tsx scripts/generate-narration.ts
          fi

      - name: Commit and push MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/narration/
          if git diff --staged --quiet; then
            echo "No new audio files generated"
          else
            git commit -m "Add generated narration audio"
            git push
          fi
